<!DOCTYPE html>
<html>
<head>
<title>HUSTLEVERSE - JATO</title>
<style>
body { background: #1a0033; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
h1 { color: #ffcc00; }
button { background: #ffcc00; color: black; border: none; padding: 15px 25px; font-size: 18px; border-radius: 10px; margin: 5px; font-weight: bold; }
.box { background: white; color: black; padding: 20px; border-radius: 15px; margin: 15px 0; }
</style>
</head>
<body>
<h1>🔥 HUSTLEVERSE 🔥</h1>
<p>Welcome JATO!</p>

<div class="box">
<p>💰 Money: <b id="money">₦500</b></p>
<p>🍲 Hunger: <b id="hunger">50</b> / 100</p>
<p id="message">Press GO WORK to hustle!</p>
</div>

<button onclick="goWork()">💼 GO WORK (+₦2,000)</button>
<br>
<button onclick="eatFood()" style="background:#00ff88;">🍲 EAT (-₦1,000)</button>

<script>
let myMoney = 500;
let myHunger = 50;

function update() {
  document.getElementById("money").innerText = "₦" + myMoney;
  document.getElementById("hunger").innerText = myHunger;
}

function goWork() {
  myMoney = myMoney + 2000;
  myHunger = myHunger + 20;
  if (myHunger > 100) { myHunger = 100; }
  document.getElementById("message").innerText = "You work! Oga pay you ₦2,000! But you dey hungry now!";
  update();
}

function eatFood() {
  if (myMoney < 1000) {
    document.getElementById("message").innerText = "You no get money to eat! Go work first!";
    return;
  }
  myMoney = myMoney - 1000;
  myHunger = myHunger - 40;
  if (myHunger < 0) { myHunger = 0; }
  document.getElementById("message").innerText = "You chop better food! Hunger don reduce!";
  update();
}
</script>
</body>
</html>
