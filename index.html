<!DOCTYPE html>
<html>
<head>
<title>HUSTLEVERSE - JATO RUNNER</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { background: #1a0033; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
h1 { color: #ffcc00; margin: 5px; font-size: 24px; }
#gameBox { background: #87CEEB; border-radius: 15px; overflow: hidden; position: relative; width: 100%; max-width: 500px; height: 300px; margin: 10px auto; border: 3px solid #ffcc00; }
canvas { width: 100%; height: 100%; display: block; }
button { background: #ffcc00; color: black; border: none; padding: 15px 10px; font-size: 18px; border-radius: 10px; margin: 5px; font-weight: bold; width: 30%; }
.controls { display: flex; justify-content: center; max-width: 500px; margin: auto; }
.box { background: white; color: black; padding: 15px; border-radius: 15px; margin: 10px auto; max-width: 500px; }
.shop { background: #2a0055; padding: 15px; border-radius: 15px; max-width: 500px; margin: auto; }
.shop button { width: 90%; background: white; }
</style>
</head>
<body>
<h1>🔥 HUSTLEVERSE - JATO RUNNER 🔥</h1>
<p>Rank: <b id="rank">Street Boy</b> | 💰 Money: <b id="money">₦500</b> | 🏆 Score: <b id="score">0</b></p>
<p id="message">Use ◀ ▶ to run, ⬆ to jump. Collect 💰, avoid 🕳️!</p>

<div id="gameBox">
<canvas id="game" width="500" height="300"></canvas>
</div>

<div class="controls">
<button onclick="moveLeft()">◀ LEFT</button>
<button onclick="jump()">⬆ JUMP</button>
<button onclick="moveRight()">RIGHT ▶</button>
</div>

<div class="box">
<p>💼 Pay per Work: <b id="pay">₦2,000</b> | 🍲 Hunger: <b id="hunger">50</b> | ⚡ Energy: <b id="energy">100</b></p>
<p>Tip: Every 💰 you collect = +₦500. Every 🕳️ you hit = -10 Energy.</p>
<button onclick="eatFood()" style="background:#00ff88; width:45%;">🍲 EAT (-₦1,000)</button>
<button onclick="sleep()" style="background:#00ccff; width:45%;">😴 SLEEP</button>
</div>

<div class="shop">
<h3>🛒 SHOP</h3>
<button onclick="buyItem('Phone',10000,4000,'📱')">📱 Phone - ₦10,000 | Pay: ₦4,000</button>
<button onclick="buyItem('Keke',50000,8000,'🛺')">🛺 Keke - ₦50,000 | Pay: ₦8,000</button>
<button onclick="buyItem('Car',150000,20000,'🚗')">🚗 Car - ₦150,000 | Pay: ₦20,000</button>
<button onclick="buyItem('House',500000,50000,'🏠')">🏠 House - ₦500,000 | Pay: ₦50,000</button>
<button onclick="buyItem('Mansion',2000000,150000,'👑')">👑 Mansion - ₦2,000,000 | Pay: ₦150,000</button>
<p>🏠 Garage: <span id="garage">Nothing yet</span></p>
<button onclick="resetGame()" style="background:#555; color:white;">🔄 RESET</button>
</div>

<script>
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");
let myMoney = Number(localStorage.getItem("jato_money")) || 500;
let myHunger = Number(localStorage.getItem("jato_hunger")) || 50;
let myEnergy = Number(localStorage.getItem("jato_energy")) || 100;
let myPay = Number(localStorage.getItem("jato_pay")) || 2000;
let myGarage = localStorage.getItem("jato_garage") || "";
let score = 0;

// Player - this is Jato, he moves
let player = { x: 50, y: 210, w: 40, h: 50, vy: 0, jumping: false, frame: 0, dir: 1 };
let coins = [];
let holes = [];
let groundY = 260;

function save() {
  localStorage.setItem("jato_money", myMoney);
  localStorage.setItem("jato_hunger", myHunger);
  localStorage.setItem("jato_energy", myEnergy);
  localStorage.setItem("jato_pay", myPay);
  localStorage.setItem("jato_garage", myGarage);
}
function getRank() {
  if (myMoney >= 2000000) return "👑 BILLIONAIRE";
  if (myMoney >= 500000) return "🏠 LANDLORD";
  if (myMoney >= 150000) return "🚗 BIG MAN";
  if (myMoney >= 50000) return "👑 BIG BOY";
  if (myMoney >= 10000) return "🔥 HUSTLER";
  return "🚶 Street Boy";
}
function updateUI() {
  document.getElementById("money").innerText = "₦" + myMoney.toLocaleString();
  document.getElementById("hunger").innerText = myHunger;
  document.getElementById("energy").innerText = myEnergy;
  document.getElementById("pay").innerText = "₦" + myPay.toLocaleString();
  document.getElementById("rank").innerText = getRank();
  document.getElementById("garage").innerText = myGarage || "Nothing yet";
  document.getElementById("score").innerText = score;
  save();
}
function moveLeft() { player.x -= 25; player.dir = -1; if (player.x < 0) player.x = 0; }
function moveRight() { player.x += 25; player.dir = 1; if (player.x > 450) player.x = 450; }
function jump() {
  if (!player.jumping) { player.vy = -14; player.jumping = true; }
}
// Touch and keyboard controls
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") moveLeft();
  if (e.key === "ArrowRight") moveRight();
  if (e.key === "ArrowUp" || e.key === " ") jump();
});
function spawn() {
  if (Math.random() < 0.03) coins.push({ x: 500, y: 180 + Math.random() * 60 });
  if (Math.random() < 0.015) holes.push({ x: 500, w: 40 });
}
function draw() {
  // Sky
  ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, 500, 300);
  // Sun
  ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(450, 40, 25, 0, Math.PI * 2); ctx.fill();
  // Buildings
  ctx.fillStyle = "#666"; ctx.fillRect(0, 120, 80, 140); ctx.fillRect(100, 100, 80, 160); ctx.fillRect(320, 130, 80, 130);
  // Road
  ctx.fillStyle = "#333"; ctx.fillRect(0, groundY, 500, 40);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 278, 500, 4);
  // Holes
  holes.forEach(h => {
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(h.x + 20, groundY + 5, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.font = "20px Arial"; ctx.fillText("🕳️", h.x + 10, groundY + 8);
  });
  // Coins
  coins.forEach(c => {
    ctx.font = "30px Arial"; ctx.fillText("💰", c.x, c.y);
  });
  // Player - Jato with legs animation
  player.frame += 0.2;
  let legOffset = Math.sin(player.frame) * 5;
  ctx.font = "45px Arial";
  // Body
  ctx.fillStyle = "#ffcc00"; ctx.fillRect(player.x + 5, player.y + 10, 30, 30);
  // Head
  ctx.fillText(player.dir === 1 ? "🏃" : "🏃", player.x, player.y + 35);
  // Name
  ctx.fillStyle = "white"; ctx.font = "bold 12px Arial"; ctx.fillText("JATO", player.x + 2, player.y - 5);
}

function gameLoop() {
  // Gravity
  player.y += player.vy;
  player.vy += 0.8;
  if (player.y >= 210) { player.y = 210; player.vy = 0; player.jumping = false; }
  spawn();
  // Move coins and holes to the left - world moves
  coins.forEach(c => c.x -= 3);
  holes.forEach(h => h.x -= 3);
  coins = coins.filter(c => c.x > -30);
  holes = holes.filter(h => h.x > -50);
  // Check coin collection
  coins = coins.filter(c => {
    let hit = Math.abs(c.x - player.x) < 30 && Math.abs(c.y - (player.y + 20)) < 40;
    if (hit) { myMoney += 500; score += 1; document.getElementById("message").innerText = "You collected money! +₦500"; }
    return !hit;
  });
  // Check hole hit
  holes.forEach(h => {
    if (Math.abs(h.x - player.x) < 25 && player.y >= 210) {
      myEnergy -= 10; myHunger += 5;
      document.getElementById("message").innerText = "Ouch! You fell in a pothole! -10 Energy";
      h.x = -100; // remove hole
      if (myEnergy <= 0) { myEnergy = 0; document.getElementById("message").innerText = "You are tired! Press SLEEP!"; }
    }
  });
  draw();
  updateUI();
  requestAnimationFrame(gameLoop);
}
function eatFood() {
  if (myMoney < 1000) { document.getElementById("message").innerText = "No money! Collect coins!"; return; }
  myMoney -= 1000; myHunger -= 40; if (myHunger < 0) myHunger = 0;
  document.getElementById("message").innerText = "You ate! Hunger reduced!"; updateUI();
}
function sleep() { myEnergy = 100; document.getElementById("message").innerText = "You slept! Energy is full!"; updateUI(); }
function buyItem(name, cost, newPay, emoji) {
  if (myPay >= newPay) { document.getElementById("message").innerText = "You already bought " + name + "!"; return; }
  if (myMoney < cost) { document.getElementById("message").innerText = name + " is ₦" + cost.toLocaleString() + "! Collect more coins!"; return; }
  myMoney -= cost; myPay = newPay; myGarage += " " + emoji + " " + name;
  document.getElementById("message").innerText = "You bought " + name + "!"; updateUI();
}
function resetGame() { localStorage.clear(); location.reload(); }
updateUI();
gameLoop();
</script>
</body>
</html>
